<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>웹소 집필 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a4b2a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="웹소노트">
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#2b2622;--mut:#8a8176;--line:#e2d9c8;--acc:#7a4b2a;--acc2:#a8683b;--warn:#b3402a;--ok:#3d6b4a}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b19;--card:#262320;--ink:#ece6dc;--mut:#9d9487;--line:#3a3530;--acc:#d6a273;--acc2:#e3b98f;--warn:#e07a63;--ok:#7fb48c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;color:var(--mut);text-align:right;line-height:1.3}
.st.dirty{color:var(--warn)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--warn)}
button.sm{padding:4px 9px;font-size:13px}
.wrap{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.row.sp{justify-content:space-between}
.proj{cursor:pointer}
.proj b{font-size:16px}
.mut{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}
textarea,input[type=text],input[type=email]{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;overflow:hidden}
textarea:focus,input:focus{outline:2px solid var(--acc2);outline-offset:0}
.page{font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif;line-height:1.85;min-height:300px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;max-width:520px;margin:0 auto}
.bar .cnt{flex:1;font-size:12.5px;line-height:1.35}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
details>summary{padding:11px 12px;cursor:pointer;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>div.in{padding:0 12px 12px}
.sub{border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.person{border:1px dashed var(--line);border-radius:10px;padding:8px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
tr.tot td{font-weight:700;background:rgba(122,75,42,.08)}
tr.grp td{text-align:left;color:var(--mut);font-size:12px;padding-top:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
#modal h3{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:9px 0}
.opt input{margin-top:3px}
.sp-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sp-item mark{background:rgba(224,160,60,.35);color:inherit}
.chip{display:inline-block;margin:3px 4px 3px 0;padding:5px 10px;border-radius:16px;font-size:13px;border:1px solid var(--line);background:var(--card)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
</style>
</head>

<div id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }

/* ================= 데이터/저장 ================= */
const KEY = 'webnovel_notes_v1';
let DB = { projects: [], email: '', fs: 16, customKw: [], deleted: {}, gcid: '', gEmail: '', gLinked: false, gLast: 0, gFileId: '' };
const KW = [['장르·시대',['#현대물','#시대물','#서양풍','#동양풍','#로판','#판타지','#학원물','#사극','#무협','#SF','#헌터물','#아포칼립스']],['캐릭터·관계',['#미남수','#미남공','#미인수','#미인공','#능력수','#능력공','#절륜수','#절륜공','#아방수','#아방공','#첫사랑','#매력녀','#능력녀','#미녀','#미남','#다정남','#집착남','#냉미남','#까칠수','#순정공','#후회공','#짝사랑','#소꿉친구','#삼각관계','#재회물']],['소재·설정',['#회귀','#빙의','#환생','#복수','#성장물','#계약연애','#계약결혼','#궁정물','#재벌','#연예계','#오메가버스','#먼치킨']],['분위기',['#달달물','#힐링물','#개그','#시리어스','#피폐물','#사이다','#로맨스','#느와르']]];
let dirty = false, lastSaved = null, storageOK = true;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) DB = Object.assign(DB, JSON.parse(r)); } catch (e) { storageOK = false; }
}
function save(manual) {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); storageOK = true; dirty = false; lastSaved = new Date(); if (manual) toast('저장했습니다'); }
  catch (e) { storageOK = false; toast('내부저장소에 저장하지 못했습니다. 백업 파일을 받아두세요'); }
  paintStatus();
}
function touch() { dirty = true; const p = curP(); if (p) p.updated = Date.now(); paintStatus(); }
function paintStatus() {
  const e = $('#st'); if (!e) return;
  e.className = 'st' + (dirty ? ' dirty' : '');
  e.innerHTML = (dirty ? '저장 대기' : '저장됨') + '<br>' + (lastSaved ? hm(lastSaved) : (storageOK ? '' : '저장소 불가'));
}
setInterval(() => { if (dirty) save(); if (DB.gLinked && G.tok && Date.now() < G.exp - 60000) syncNow(false); }, 5 * 60 * 1000);          // 5분마다 자동 저장
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) save(); });
window.addEventListener('pagehide', () => { if (dirty) save(); });

const DEF_FIELDS = [['name','이름'],['age','나이'],['height','키(외모)'],['face','얼굴(외모)'],['pers','성격'],['past','과거사']].map(([id,label]) => ({id,label}));
const newSub = () => ['가족','업무','친구'].map(n => ({ name: n, people: [] }));
function newProject(title) {
  return { id: uid(), title, created: Date.now(), updated: Date.now(),
    syn: { logline: '', leadFields: DEF_FIELDS.map(f => ({...f})), lead: [{}, {}], support: [newSub(), newSub()], others: [],
      era: '', place: '', fantasy: '', plot: { gi: '', seung: '', jeon: '', gyeol: '' }, treat: [''] },
    body: { pro: '', eps: [{ t: '', x: '' }], epi: '', side: [] } };
}

/* ================= 글자수 ================= */
const cnt = s => ({ w: [...String(s || '').replace(/[\r\n]/g, '')].length, n: [...String(s || '').replace(/\s/g, '')].length });
function charsText(p) {
  const s = p.syn, o = [];
  s.lead.forEach(L => s.leadFields.forEach(f => L[f.id] && o.push(L[f.id])));
  s.support.forEach(g => g.forEach(sg => sg.people.forEach(q => o.push(q.name || '', q.rel || '', q.memo || ''))));
  s.others.forEach(q => o.push(q.name || '', q.rel || '', q.memo || ''));
  return o.join('\n');
}
function rowsOf(p) {
  const s = p.syn, b = p.body, r = [];
  r.push({ g: 'syn', label: '로그라인', text: s.logline });
  r.push({ g: 'syn', label: '등장인물', text: charsText(p) });
  r.push({ g: 'syn', label: '배경', text: [s.era, s.place, s.fantasy].join('\n') });
  r.push({ g: 'syn', label: '줄거리(기승전결)', text: [s.plot.gi, s.plot.seung, s.plot.jeon, s.plot.gyeol].join('\n') });
  r.push({ g: 'syn', label: '트리트먼트', text: s.treat.join('\n') });
  r.push({ g: 'body', label: '프롤로그', text: b.pro });
  b.eps.forEach((e, i) => r.push({ g: 'body', label: (i + 1) + '화', text: e.x }));
  r.push({ g: 'body', label: '에필로그', text: b.epi });
  b.side.forEach((e, i) => r.push({ g: 'body', label: '외전' + (i + 1) + '화', text: e.x }));
  return r;
}
function sumRows(rs) { return rs.reduce((a, r) => { const c = cnt(r.text); return { w: a.w + c.w, n: a.n + c.n }; }, { w: 0, n: 0 }); }
const totals = p => { const rs = rowsOf(p); return { syn: sumRows(rs.filter(r => r.g === 'syn')), body: sumRows(rs.filter(r => r.g === 'body')), all: sumRows(rs) }; };

/* ================= 상태/경로 ================= */
let V = { s: 'home', pid: null, tab: 'syn', key: null, ctab: 'lead' };
const curP = () => DB.projects.find(p => p.id === V.pid);
function getP(o, path) { return path.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setP(o, path, v) { const k = path.split('.'); const l = k.pop(); const t = k.reduce((a, x) => a[x], o); t[l] = v; }
const keyText = (p, key) => {
  const [k, i] = key.split(':'); const s = p.syn, b = p.body;
  switch (k) {
    case 'logline': return s.logline; case 'chars': return charsText(p);
    case 'setting': return [s.era, s.place, s.fantasy].join('\n');
    case 'plot': return [s.plot.gi, s.plot.seung, s.plot.jeon, s.plot.gyeol].join('\n');
    case 'treat': return s.treat.join('\n'); case 'pro': return b.pro; case 'epi': return b.epi;
    case 'ep': return b.eps[i].x; case 'side': return b.side[i].x;
  } return '';
};
const keyName = (p, key) => {
  const [k, i] = key.split(':');
  return { logline: '로그라인', chars: '등장인물', setting: '배경', plot: '줄거리', treat: '트리트먼트', pro: '프롤로그', epi: '에필로그' }[k] || (k === 'ep' ? (+i + 1) + '화' : '외전' + (+i + 1) + '화');
};

/* ================= 모달 ================= */
function modal(html) { const m = $('#modal'); m.onclick = null; m.innerHTML = '<div class="box">' + html + '</div>'; m.classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function ask(title, ph, val = '') {
  return new Promise(res => {
    modal(`<h3>${esc(title)}</h3><input type="text" id="askin" placeholder="${esc(ph)}" value="${esc(val)}"><div class="row sp" style="margin-top:12px"><button data-a="x">취소</button><button class="pri" data-a="ok">확인</button></div>`);
    const i = $('#askin'); i.focus();
    const done = v => { closeModal(); res(v); };
    $('#modal').onclick = e => { const a = e.target.dataset.a; if (a === 'ok') done(i.value.trim()); else if (a === 'x' || e.target.id === 'modal') done(null); };
    i.onkeydown = e => { if (e.key === 'Enter') done(i.value.trim()); };
  });
}
function confirmBox(msg, okLabel = '삭제') {
  return new Promise(res => {
    modal(`<h3>확인</h3><p style="white-space:pre-wrap">${esc(msg)}</p><div class="row sp"><button data-a="x">취소</button><button class="pri" data-a="ok">${esc(okLabel)}</button></div>`);
    $('#modal').onclick = e => { const a = e.target.dataset.a; if (a === 'ok') { closeModal(); res(true); } else if (a === 'x' || e.target.id === 'modal') { closeModal(); res(false); } };
  });
}

/* ================= 화면 ================= */
const hdr = (title, back) => `<header class="top">${back ? '<button class="ghost" data-act="back">‹</button>' : ''}<h1>${esc(title)}</h1><div class="st" id="st"></div><button class="sm" data-act="saveNow">저장</button><button class="sm" data-act="menu">⋯</button></header>`;
function render() {
  const a = $('#app'), p = curP();
  if (V.s === 'home') {
    a.innerHTML = hdr('웹소 집필 노트', false) + `<div class="wrap">` +
      (DB.projects.length ? DB.projects.map(pr => { const t = totals(pr).all; return `<div class="card proj" data-act="open" data-id="${pr.id}"><div class="row sp"><b>${esc(pr.title)}</b><button class="sm ghost" data-act="renameP" data-id="${pr.id}">이름변경</button></div><div class="mut">총 ${t.w.toLocaleString()}자(공백포함) · ${t.n.toLocaleString()}자(공백제외)</div><div class="mut">수정 ${new Date(pr.updated).toLocaleDateString('ko-KR')}</div></div>`; }).join('') : '<div class="card mut">아직 프로젝트가 없습니다.</div>') +
      `<button class="pri" style="width:100%;margin-top:6px" data-act="newP">+ 새 프로젝트</button></div>`;
  } else if (V.s === 'project') {
    const t = totals(p);
    const sy = [['logline','로그라인'],['chars','등장인물'],['setting','배경'],['plot','줄거리(기승전결)'],['treat','트리트먼트']];
    const li = (key, label) => `<div class="item" data-act="edit" data-key="${key}"><span>${esc(label)}</span><span class="mut">${cnt(keyText(p, key)).w.toLocaleString()}자 ›</span></div>`;
    let list;
    if (V.tab === 'syn') list = `<div class="list">${sy.map(([k, l]) => li(k, l)).join('')}</div>`;
    else list = `<div class="list">${li('pro','프롤로그')}${p.body.eps.map((_, i) => li('ep:' + i, (i + 1) + '화')).join('')}${li('epi','에필로그')}${p.body.side.map((_, i) => li('side:' + i, '외전' + (i + 1) + '화')).join('')}</div>
      <div class="row"><button style="flex:1" data-act="addEp">+ 화 추가</button><button style="flex:1" data-act="addSide">+ 외전 추가</button></div>`;
    a.innerHTML = hdr(p.title, true) + `<div class="wrap"><div class="tabs"><button class="${V.tab==='syn'?'on':''}" data-act="tab" data-t="syn">시놉시스</button><button class="${V.tab==='body'?'on':''}" data-act="tab" data-t="body">본문</button></div>${list}
      <div class="card mut" style="margin-top:10px">시놉시스 ${t.syn.w.toLocaleString()}자 · 본문 ${t.body.w.toLocaleString()}자 · 전체 ${t.all.w.toLocaleString()}자 <span>(공백포함)</span></div>
      <div class="row" style="margin-top:8px"><button style="flex:1" data-act="counts">글자수 보기</button><button class="pri" style="flex:1" data-act="export">내보내기</button></div></div>`;
  } else if (V.s === 'edit') {
    a.innerHTML = hdr(keyName(p, V.key), true) + `<div class="wrap">${editor(p, V.key)}</div>` +
      `<div class="bar"><div class="cnt" id="cc"></div><button class="sm" data-act="spell">맞춤법</button><button class="sm" data-act="fsm">가−</button><button class="sm" data-act="fsp">가+</button></div>`;
    document.querySelectorAll('textarea').forEach(grow); updCount();
  }
  paintStatus();
}
const grow = t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; };
function updCount() { const p = curP(), e = $('#cc'); if (!e || !p) return; const c = cnt(keyText(p, V.key)); e.innerHTML = `공백포함 <b>${c.w.toLocaleString()}</b>자<br>공백제외 <b>${c.n.toLocaleString()}</b>자`; }
const ta = (path, v, ph = '', cls = '') => `<textarea class="${cls}" data-p="${path}" placeholder="${esc(ph)}" rows="2">${esc(v)}</textarea>`;

function editor(p, key) {

    case 'addScene': s.treat.push(''); R(); break;

    case 'addKw': { kwBox(s); let k = $('#kwin').value.trim().replace(/\s+/g, ''); if (!k) break; if (k[0] !== '#') k = '#' + k; if (!s.kw.includes(k)) s.kw.push(k); DB.customKw = DB.customKw || []; if (!KW.some(g => g[1].includes(k)) && !DB.customKw.includes(k)) DB.customKw.push(k); R(); break; }
    case 'addField': { const n = await ask('새 입력 항목 이름', '예: 말버릇, 특기, 직업'); if (n) { s.leadFields.push({ id: 'f' + Date.now().toString(36), label: n }); R(); } break; }
    case 'delField': if (await confirmBox('이 항목과 입력된 내용을 모든 주연에서 지울까요?')) { s.leadFields = s.leadFields.filter(f => f.id !== d.id); s.lead.forEach(L => delete L[d.id]); R(); } break;
    case 'addSub': { const n = await ask('하위 그룹 이름', '예: 학교, 적대 세력'); if (n) { s.support[+d.i].push({ name: n, people: [] }); R(); } break; }

    case 'addPerson': s.support[+d.i][+d.j].people.push({ name: '', rel: '', memo: '' }); R(); break;

    case 'doExport': doExport(); break;
    case 'delProject': { const pr = DB.projects.find(x => x.id === d.id); if (await confirmBox('「' + pr.title + '」 프로젝트 전체를 삭제할까요?\n되돌릴 수 없습니다.')) { DB.projects = DB.projects.filter(x => x !== pr); DB.deleted = DB.deleted || {}; DB.deleted[pr.id] = Date.now(); V = { s: 'home' }; touch(); save(); render(); } break; }
    case 'backup': backup(); break;
    case 'restore': $('#rf').click(); break;
    case 'gsync': syncNow(true); break;
    case 'gout': if (await confirmBox('연결을 해제할까요? 이 기기의 글은 그대로 남습니다.', '해제')) { DB.gLinked = false; DB.gFileId = ''; DB.gEmail = ''; G.tok = null; save(); settings(); } break;
    case 'saveEmail': DB.email = $('#em').value.trim(); touch(); save(); toast('이메일을 등록했습니다'); break;

/* ================= 맞춤법(간이) ================= */
const RULES = [
  [/몇일/g, '며칠'], [/웬지/g, '왠지'], [/왠만/g, '웬만'], [/어떻해/g, '어떡해'], [/금새/g, '금세'], [/됬/g, '됐'],
  [/되요/g, '돼요'], [/뵈요/g, '봬요'], [/읍니다/g, '습니다'], [/어의없/g, '어이없'], [/설레임/g, '설렘'], [/바램/g, '바람'],
  [/일일히/g, '일일이'], [/깨끗히/g, '깨끗이'], [/열심이(?=\s*(하|해|했))/g, '열심히'], [/솔직이/g, '솔직히'],
  [/(할|갈|줄|볼|올|살|알|걸|될)께(요)?/g, (m, a, b) => a + '게' + (b || '')], [/않되/g, '안 돼'], [/담궈/g, '담가'],
  [/ {2,}/g, ' ', '연속 공백'], [/([!?]){4,}/g, '$1$1$1', '문장부호 과다'], [/(?<!\.)\.\.(?!\.)/g, '…', '말줄임표 확인']
];
let SP = [], LF = null;
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('textarea[data-p]')) LF = e.target; });
function runSpell(text) {
  const out = [];
  RULES.forEach(([re, fix, note]) => { re.lastIndex = 0; let m; while ((m = re.exec(text))) { out.push({ i: m.index, len: m[0].length, w: m[0], fix: typeof fix === 'function' ? fix(...m) : m[0].replace(new RegExp(re.source), fix), note }); if (m[0].length === 0) re.lastIndex++; } });
  out.sort((a, b) => a.i - b.i); return out;
}
function spellDlg() {
  const t = (LF && document.body.contains(LF) ? LF : null) || document.querySelector('textarea.page') || document.querySelector('textarea[data-p]');
  if (!t) { toast('검사할 본문이 없습니다'); return; }
  SP = runSpell(t.value); SP.target = t.dataset.p;
  const list = SP.length ? SP.map((r, n) => { const a = t.value.slice(Math.max(0, r.i - 10), r.i), b = t.value.slice(r.i + r.len, r.i + r.len + 10); return `<div class="sp-item"><div>${esc(a)}<mark>${esc(r.w)}</mark>${esc(b)}</div><div class="row sp"><span class="mut">→ ${esc(r.fix)} ${r.note ? '· ' + r.note : ''}</span><button class="sm" data-act="fix" data-n="${n}">고치기</button></div></div>`; }).join('') : '<p>자주 틀리는 표현은 발견되지 않았습니다.</p>';
  modal(`<h3>맞춤법 (간이 검사)</h3><p class="mut">앱 안에서는 자주 틀리는 표현만 잡습니다. 문법·띄어쓰기 전체 검사는 아래 검사기를 쓰세요. 본문을 자동 복사해 열어줍니다(붙여넣기, 긴 글은 나눠서).</p>${list}<div class="row" style="margin-top:12px"><button style="flex:1" data-act="busan">부산대(나라) 검사기</button><button style="flex:1" data-act="naver">네이버 검사기</button></div><button style="width:100%;margin-top:8px" data-act="close">닫기</button>`);
}
function applyFix(n) {
  const r = SP[n], t = document.querySelector(`[data-p="${SP.target}"]`); if (!r || !t) return;
  if (t.value.substr(r.i, r.len) !== r.w) { toast('이미 바뀐 문장입니다'); return; }
  t.value = t.value.slice(0, r.i) + r.fix + t.value.slice(r.i + r.len);
  setP(curP(), SP.target, t.value); grow(t); touch(); updCount(); spellDlg();
}
function copyAndOpen(url) {
  const t = document.querySelector(`[data-p="${SP.target}"]`);
  try { navigator.clipboard.writeText(t ? t.value : ''); toast('본문을 복사했습니다. 검사창에 붙여넣으세요'); } catch (e) { }
  window.open(url, '_blank', 'noopener');
}

function loadGIS() {

    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = res;
    sc.onerror = () => rej(new Error('구글 로그인 스크립트를 불러오지 못했습니다(인터넷 연결 확인)')); document.head.appendChild(sc);
  });
}
async function gToken() {

  await loadGIS();

    const tc = google.accounts.oauth2.initTokenClient({ client_id: DB.gcid, scope: SCOPE,
      callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); if (google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/drive.file')) return rej(new Error('구글 로그인 창에서 "Google Drive" 접근 체크박스를 선택해야 합니다. 다시 연결해 주세요')); G.tok = r.access_token; G.exp = Date.now() + (r.expires_in || 3600) * 1000; res(G.tok); },
      error_callback: e => rej(new Error('로그인이 취소되었거나 팝업이 막혔습니다 (' + (e.type || '') + ')')) });

}
async function gapi(url, opt = {}) {

}
/* 병합: 프로젝트별로 수정시각이 더 최근인 쪽을 채택, 삭제 기록 반영 */

  const map = {};

  const projects = Object.values(map).filter(p => !(del[p.id] && del[p.id] >= (p.updated || 0))).sort((a, b) => (b.updated || 0) - (a.updated || 0));

async function backup() {

/* ================= 내보내기 ================= */
function lines(t) { return String(t || '').replace(/\r/g, '').split('\n'); }
function paras(p, scope) {
  const o = [], s = p.syn, b = p.body, P = (k, t, pb) => o.push({ k, t, pb });
  const kv = (label, v) => { const L = lines(v); if (!String(v || '').trim()) return; P('p', label + ': ' + L[0]); L.slice(1).forEach(x => P('p', x)); };
  const blk = (h, v) => { P('h1', h); lines(v).forEach(x => P('p', x)); P('p', ''); };
  if (scope !== 'body') {
    P('title', p.title + ' 시놉시스'); P('p', '');
    blk('로그라인', s.logline);
    P('h1', '등장인물'); if (!s.kw) s.kw = [...new Set(s.lead.flatMap(L => L.kw || []))]; kv('키워드', s.kw.join(' ')); P('h2', '주연');
    s.lead.forEach((L, i) => { P('h2', '주연 ' + (i + 1) + (L.name ? ' · ' + L.name : '')); s.leadFields.forEach(f => f.id !== 'name' && kv(f.label, L[f.id])); P('p', ''); });
    s.support.forEach((g, i) => { const has = g.some(sg => sg.people.length); if (!has) return; P('h2', '조연 (주연 ' + (i + 1) + ' 관련)'); g.forEach(sg => { if (!sg.people.length) return; P('p', '[' + sg.name + ']'); sg.people.forEach(q => kv(q.name || '(이름 없음)', [q.rel, q.memo].filter(Boolean).join(' / '))); }); P('p', ''); });
    if (s.others.length) { P('h2', '기타 관련인'); s.others.forEach(q => kv(q.name || '(이름 없음)', [q.rel, q.memo].filter(Boolean).join(' / '))); P('p', ''); }
    P('h1', '배경'); kv('시대', s.era); kv('장소', s.place); kv('판타지 설정', s.fantasy); P('p', '');
    P('h1', '줄거리'); [['기', s.plot.gi], ['승', s.plot.seung], ['전', s.plot.jeon], ['결', s.plot.gyeol]].forEach(([l, v]) => { P('h2', l); lines(v).forEach(x => P('p', x)); }); P('p', '');
    P('h1', '트리트먼트'); s.treat.forEach((t, n) => { P('h2', 'S#' + (n + 1)); lines(t).forEach(x => P('p', x)); });
  }
  if (scope !== 'syn') {
    const ch = (h, t, pb) => { P('h1', h, pb); lines(t).forEach(x => P('p', x)); };
    const sub = (it, base) => base + (it.t ? ' ' + it.t : '');
    if (scope === 'body') P('title', p.title);
    ch('프롤로그', b.pro, scope === 'all');
    b.eps.forEach((e, i) => ch(sub(e, (i + 1) + '화'), e.x, true));
    ch('에필로그', b.epi, true);
    b.side.forEach((e, i) => ch(sub(e, '외전' + (i + 1) + '화'), e.x, true));
  }
  return o;
}
function toTxt(ps) { return ps.map(x => x.k === 'h1' ? (x.pb ? '\n\n' : '') + '■ ' + x.t : x.k === 'h2' ? '▶ ' + x.t : x.t).join('\n'); }
const xe = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function toHwpx(ps, title) {

function doExport() {

  const jobs = mode === 'sep' ? [['syn', '시놉시스'], ['body', '본문']] : [['all', '전체']];
